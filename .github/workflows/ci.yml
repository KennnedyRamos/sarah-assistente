name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    # Windows: o projeto usa Job Objects, DPAPI, a Lixeira e atalhos do Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Dependências
        run: python -m pip install -r requirements.txt
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Testes (pytest)
        # sem Ollama no runner: os testes de integração com o modelo real são pulados sozinhos
        run: python -m pytest -q
